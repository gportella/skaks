[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skaks-opt"
version = "0.2.0"
description = "Unified CLI for skaks parameter fitting, Texel tuning, self-play optimization, and arena orchestration."
authors = [{ name = "skaks" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0.1",
  "optuna>=3.6.0",
  "tqdm>=4.66",
  "rich>=13.7",
]

[project.optional-dependencies]
selfplay = [
  "python-chess>=1.999",
  "dask[distributed]>=2024.5.0",
]
full = [
  "python-chess>=1.999",
  "dask[distributed]>=2024.5.0",
  "pandas>=2.2",
]

[project.scripts]
skaks-opt = "skaks_opt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["skaks_opt", "validation_moves"]

[tool.hatch.build.targets.sdist]
include = ["skaks_opt", "validation_moves", "docs/redundant_scripts.md"]
